# ==========================================================================
# Solver selection
# ==========================================================================

[Solver]
method     = "MB-IPM-classic"     # "IPM_classic", "IPM_amu", "IPM_mb", "MB-IPM-classic", "AL", "VP"
n_steps    = 100          # number of load steps

# ==========================================================================
# IPM parameters
# ==========================================================================

[IPM]
k_max      = 200      # maximum total (outer) IPM iterations
max_inner  = 50       # maximum Newton iterations per fixed barrier parameter
mu_init    = 1e-3     # initial barrier parameter mu_0
mu_end     = 1e-14    # final barrier parameter tolerance
tol_end    = 1e-12    # final residual tolerance
theta      = 0.1      # adaptive Newton tolerance multiplier: tol = max(tol_end, theta * mu)
delta      = 0.5      # barrier parameter update exponent: mu_{k+1} = max_alpha(dlambda * s)^(1+delta)
tau_min    = 0.995    # fraction-to-boundary parameter
verbose    = true     # print convergence information per load step
# dt is derived automatically from [Solver] n_steps as dt = 1/n_steps

# ==========================================================================
# Modified-Barrier IPM -- base method (Polyak 1992), no acceleration
# ==========================================================================
# Port of the finite-strain Julia routine mb_ipm_classic.jl (MBIPMClassic):
# mu fixed, fixed inner tolerance, flat cold start, KKT-only outer test and no
# inner-failure safeguard.

[MB_IPM_classic]
k_max        = 500     # maximum outer (multiplier) iterations. Higher than the
                       # Julia default of 100: with mu fixed the Polyak outer
                       # rate C = mu/(mu + a*lam*) is only linear, and on
                       # multi-slip orientations 100 sweeps stall at
                       # r_kkt ~ 1e-9, above tol_phi = 1e-10.
max_inner    = 100     # maximum Newton iterations per outer step
mu_init      = 1e-2    # shift parameter mu -- FIXED for the whole solve
lambda_init  = 3e-5    # cold-start seed for both lam_k and the slip (must be > 0);
                       # should scale with the load increment
tol_phi      = 1e-10   # outer KKT tolerance in stress units (natural residual)
theta_in     = 1e-2    # inner tolerance = theta_in * tol_phi (fixed)
tau_min      = 0.995   # fraction-to-boundary safety factor (applied to s + mu)
dlam_bound   = 1e-12   # slips at/below this are exempt from the FTB cap (anti-jamming)
verbose      = true    # print convergence information per load step

# ==========================================================================
# Augmented Lagrangian parameters (Schmidt-Baldassari 2003)
# ==========================================================================

[AL]
max_outer  = 100       # maximum outer (penalty) iterations (Algorithm 1, i_max)
max_inner  = 100       # maximum semi-smooth Newton iterations per outer step
eta_init   = 200.0       # initial penalty parameter eta(0) (paper: 0.005 1/GPa; scale to your stress units)
eps_c      = 1e-10     # KKT-check tolerance (Algorithm 1, line 7): Phi<=eps_c, dlambda>=-eps_c, |Phi*dlambda|<=eps_c
eps_min    = 1e-10     # inner Newton residual tolerance (Algorithm 1, line 3): ||R||_2 < eps_min
verbose    = true      # print convergence information per load step

# ==========================================================================
# Visco-plastic solver parameters
# ==========================================================================

[VP]
max_iter   = 50       # maximum Newton iterations
tol        = 1e-14     # residual convergence tolerance
# dt is derived automatically from [Solver] n_steps as dt = 1/n_steps
p          = 1        # rate exponent (1 = linear Bingham; p>1 = power-law Perzyna
eta        = 3.061e-1     # viscosity parameter (dgamma0 = dt/eta); overstress ~ eta * gamma_dot
verbose    = true     # print convergence information per load step

# ==========================================================================
# Material parameters
# ==========================================================================

[Material]
E          = 1500.0    # Young's modulus in MPa
nu         = 0.3    # Poisson's ratio
tau0       = 1.0      # initial critical resolved shear stress in MPa
q          = 1.0      # latent hardening ratio
xi         = 0.5      # hardening saturation exponent
tau_inf    = 0.0      # saturation shear stress in MPa
phi_deg    = [0.0, 0.0, 0.0]   # Euler angles in degree
